name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Tauri Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-latest
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ChmlFrp 社区工具箱 ${{ github.ref_name }}'
          releaseBody: |
            ## v1.4.1 更新汇总
            ### 新增功能
            - **节点推荐值**：节点测试表格新增推荐值列，基于带宽速度（60%）和延迟（40%）加权计算 0-100 分，支持点击排序，分数按颜色分级（绿/蓝/黄/红）
            - **清理本地缓存**：设置-数据维护新增「清理本地缓存」（Beta），一键清除节点测速结果、节点列表缓存、测试历史和 UDP 缓存
            - **清理应用日志**：设置-数据维护新增「清理应用日志」（Beta），一键清空 DNS 容灾、DDNS 解析、SSL 证书申请的历史日志
            - **Linux ARM64 支持**：新增树莓派 4/5、香橙派等 ARM64 设备的安装包，使用 GitHub 原生 ARM64 runner 编译

            ### 界面优化
            - **表格横向滚动条**：修复节点测试表格在内容未溢出时仍显示横向滚动条的问题，改为仅内容溢出时显示
            - **开发者署名**：设置-关于区块底部新增开发者署名与 UI 设计来源声明

            ### 安全增强
            - **frpc 配置注入防护**：生成 frpc 配置文件时校验所有字段，拒绝包含换行符、方括号、等号的值，防止注入额外配置项
            - **背景文件扩展名校验**：复制背景视频/图片时校验扩展名白名单，防止任意文件被塞入 backgrounds 目录
            - **本地测速服务器防护**：文件服务器校验 Host header 防御 DNS rebinding 攻击

            ### 问题修复
            - **ChmlFrp 免费域名 TTL**：将 DDNS/容灾调用 ChmlFrp 免费 API 的 TTL 从「1分钟」调整为「10分钟」，避免触发 API 「400-此域名的TTL最少为10分钟」错误
            - **Linux 包名规范化**：将 productName 从中文「ChmlFrp社区工具箱」改为英文「ChmlFrp Community Toolbox」，修复 ARM64 deb/rpm/AppImage 包名含中文导致的打包失败问题（Windows 安装包显示名仍为中文）

            ### 代码优化
            - **模块合并**：合并 file_server.rs 与 tcp_speed.rs 为 speedtest_server.rs，减少编译单元
            - **背景文件去重**：合并 copy_background_video/image 重复逻辑为统一函数
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
