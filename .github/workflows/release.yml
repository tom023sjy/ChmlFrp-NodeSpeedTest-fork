name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Tauri Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-latest
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ChmlFrp 社区工具箱 ${{ github.ref_name }}'
          releaseBody: |
            ## v1.4.3 更新汇总

            ### 新增功能
            - **设备远程管理**：支持远程查看服务状态、控制服务和查看运行日志。
            - **设备互联测试**：新增设备间测速和远程命令执行能力，实时显示测试进度。
            - **域名与证书管理**：新增 DDNS 解析、DNS 容灾和 SSL 证书管理功能。

            ### 界面优化
            - **设备列表自动更新**：设备列表改为自动实时更新，移除手动刷新按钮，减少重复操作。
            - **节点测试历史**：修复返回节点测试页面后表格内容没有正确恢复的问题。
            - **远程管理面板**：更新日志和服务日志使用统一的灰色滚动条样式。
            - **DDNS 解析**：移除功能入口上的 Beta 标记。

            ### Bug 修复
            - **更新包安全处理**：限制更新文件保存目录和安装包路径，避免执行目录外的文件。
            - **本地数据安全**：完善本地数据库和敏感数据保护，提升跨平台存储兼容性。
            - **更新下载体验**：优化更新下载目录权限和更新过程处理。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
