name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Tauri Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ChmlFrp 社区工具箱 ${{ github.ref_name }}'
          releaseBody: |
            ## v1.3.11 更新汇总
            ### 新增功能
            - **账号数据隔离**：节点测试历史、测试结果、节点列表缓存，以及 DNS 容灾的凭证、任务、日志，均按账号隔离存储，切换账号后只显示当前账号的数据，旧数据首次访问自动迁移
            - **Cloudflare DNS 凭证**：DNS 容灾凭证新增 Cloudflare 服务商，使用 API Token 鉴权，支持查询 Zone、列出/创建/更新 CNAME 记录
            - **关于页面**：设置页新增"关于"区块，整合项目仓库、问题反馈、版本发布、官网入口

            ### 界面优化
            - **表格横向滚动条常驻**：节点测试表格横向滚动条移至外层视口底部常驻显示，无需滚动到表格内容最底部才能操作
            - **官网地址更新**：关于页与侧边栏的 ChmlFrp 官网统一为 chmlfrp.net
            - **历史版本入口**：关于页"版本发布"改为跳转 u.zdzz.top/app/node-selector 查看历史版本更新日志

            ### 安全增强
            - **登录前置校验**：节点测试的测试/刷新/历史按钮，DNS 容灾的新建任务/新增凭证/清空日志等操作，均需登录后才能使用，未登录时按钮禁用并显示提示
            - **DNS 凭证跨账号保护**：后端监控切换 CNAME 时校验凭证 owner，防止跨账号引用凭证

            ## 🚀 ChmlFrp 社区工具箱

            快速测试节点延迟，帮助用户选择最优节点。

            ## ✨ 功能特性

            - 🔍 **节点测速** - TCP 连接测试，快速获取节点延迟
            - 🌍 **地域筛选** - 支持国内/国外节点筛选
            - 👤 **用户筛选** - VIP/普通用户节点分类
            - 📊 **智能排序** - 按延迟或编号排序
            - 📌 **窗口置顶** - 方便随时查看测试进度
            - 💾 **结果持久化** - 测试结果自动保存
            - 🔄 **自动更新** - 支持 GitHub 自动检查更新
            - 🛡️ **DNS 容灾** - 监控隧道状态，主隧道异常自动切换 CNAME 到备用隧道

            ## 📥 下载说明

            | 平台 | 安装包 | 说明 |
            |------|--------|------|
            | Windows | `.msi` 或 `.exe` | 双击安装即可 |
            | macOS | `.dmg` | 拖拽到应用程序文件夹（仅支持 Apple Silicon） |
            | Linux | `.deb` 或 `.AppImage` | 根据发行版安装 |

            ## 📋 系统要求

            - **Windows**: Windows 10/11 (x64)
            - **macOS**: macOS 11.0+ (Apple Silicon)
            - **Linux**: Ubuntu 20.04+ (x64)

            ---

            **问题反馈**: https://github.com/zhengddzz/ChmlFrp-Community-Toolbox/issues
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
