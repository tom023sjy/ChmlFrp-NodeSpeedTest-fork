name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Tauri Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-latest
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        # 直接使用 runner 预装的 rustup 安装工具链（官方源下载），
        # 避免第三方 action 仓库被 codeload 间歇性限流（429）
        shell: bash
        run: |
          rustup default stable
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            rustup target add aarch64-apple-darwin
          fi

      - name: Rust cache
        # 使用官方 actions/cache 替代第三方缓存 action，避免同样的限流风险
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ matrix.platform }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-${{ matrix.platform }}-

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ChmlFrp 社区工具箱 ${{ github.ref_name }}'
          releaseBody: |
            ## v1.5.0 更新汇总

            ### 新增功能
            - **设备管理**：集中查看同账号下所有设备的在线状态、设备类型与最后活动时间，支持设备重命名与解绑。
            - **远程控制台**：远程启停、重启服务器端守护服务，查看运行状态与运行日志，远程检查并一键升级新版本。
            - **端对端测速**：选择发送端与接收端设备，测试「对端 → 节点 → 本机」全链路真实延迟与带宽，支持双向测速。
            - **设备对测试结果**：节点测试按设备对分别保存与查看，一键交换发送/接收方向。
            - **工单系统**：应用内直接提交工单，支持分类、验证码校验，可附最多 3 个图片或视频附件。
            - **工单回复与附件预览**：工单可继续回复并附带附件，图片缩略图点击放大、视频在线播放，查看过的附件自动本地缓存省流量。
            - **公告中心**：新公告启动时弹窗提醒，多条公告轮播浏览，关于页可查看公告列表并手动刷新。
            - **Markdown 公告**：公告支持标题、列表、代码块等富文本排版，代码块带一键复制按钮。
            - **DNS 容灾云端同步**：容灾任务、DNS 凭证、切换日志可保存到云端跨设备管理，任务可选云端或本地执行，本地数据一键迁移。
            - **功能远程开关**：服务端可远程停用单项功能，被停用的页面显示维护提示而非报错。

            ### 界面优化
            - **侧边栏显示控制**：可自由隐藏不常用的侧边栏入口，「设置」「关于」始终保留。
            - **设置页改版**：新增搜索框快速定位设置项，分组折叠布局并记住展开位置，收起时标题旁显示关键摘要。
            - **节点历史采样图表**：新增逐秒速度折线图与延迟采样柱状图，直观查看单次测试过程分布。
            - **测试偏好记忆**：节点延迟/带宽的统计方式（最大/平均/最小）与测速时长自动记住，跨会话生效。
            - **设备列表实时刷新**：每 5 秒自动轮询，设备上下线即时推送，无需手动刷新。
            - **测速浮窗**：端对端测试弹窗可最小化为可拖拽浮窗，继续显示测试进度。
            - **关于页独立**：「关于」从设置页独立为侧边栏入口，结构更清晰。

            ### 数据与安全
            - **数据库存储**：本地数据从 JSON 文件迁移至 SQLite 数据库，旧数据自动迁移无需操作。
            - **加密存储**：DNS 凭证等敏感信息改为加密保存。
            - **登录方式升级**：登录态改用代理令牌维持，有效期更长；旧版本登录状态需重新登录一次。
            - **应用日志**：运行日志写入本地文件，出现问题可事后排查。

            ### Bug 修复
            - **更新检查失败**：修复服务端接口路径变更后「检查更新」失败的问题。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
