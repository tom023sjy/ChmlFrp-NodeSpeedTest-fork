name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Tauri Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-latest
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ChmlFrp 社区工具箱 ${{ github.ref_name }}'
          releaseBody: |
            ## v1.4.0 更新汇总
            ### 新增功能
            - **DNS 服务商独立菜单**：DNS 凭证从「DNS 容灾」中独立为侧边栏菜单，集中管理 DNSPod、阿里云、Cloudflare 等凭证，供 DNS 容灾、DDNS 解析和 SSL 证书申请共用
            - **DDNS 解析模块**：监控本机网卡 IP 变化自动更新解析，支持 ChmlFrp 免费域名与第三方 DNS 服务商，支持 A/AAAA 记录、定时调度与分时段频率
            - **SSL 证书申请**：通过 DNS API 自动申请 Let's Encrypt / ZeroSSL 证书，后台执行不阻塞页面，最小化悬浮窗可拖动、跨页面显示，附申请日志
            - **TXT 解析清理**：设置-数据维护新增「扫描清除 TXT 解析记录」（Beta），自动扫描所有 DNS 服务商下的 TXT 记录，预选 SSL 遗留记录并自动排除证书使用中的记录
            - **统一确认弹窗**：删除证书、凭证、任务、日志等操作均增加二次确认，防止误操作

            ### 界面优化
            - **Beta 标签统一**：所有 Beta 标签使用统一组件，悬浮 500ms 显示免责声明，跟随设置开关实时生效
            - **域名选择统一**：DNS 容灾、DDNS 解析、SSL 证书申请的域名选择改为「主域名+子域名+加减号」结构，SSL 支持泛域名
            - **空状态样式统一**：DDNS 解析、SSL 证书无任务时改为卡片式"暂无任务"样式
            - **页面标题统一**：DNS 容灾、DDNS 解析、SSL 证书三个页面标题、介绍、分隔线高度保持一致
            - **扫描清除按钮标红**：TXT 解析记录清理入口改为红色醒目样式

            ### 安全增强
            - **DNS 凭证验证**：新建 DNS 凭证时强制验证有效性，连接失败无法保存
            - **TXT 清理保护**：清理 TXT 记录时自动排除当前 SSL 证书使用的记录，避免影响证书自动更新

            ## 🚀 ChmlFrp 社区工具箱

            快速测试节点延迟，帮助用户选择最优节点。

            ## ✨ 功能特性

            - 🔍 **节点测速** - TCP 连接测试，快速获取节点延迟
            - 🌍 **地域筛选** - 支持国内/国外节点筛选
            - 👤 **用户筛选** - VIP/普通用户节点分类
            - 📊 **智能排序** - 按延迟或编号排序
            - 📌 **窗口置顶** - 方便随时查看测试进度
            - 💾 **结果持久化** - 测试结果自动保存
            - 🔄 **自动更新** - 支持 GitHub 自动检查更新
            - 🛡️ **DNS 容灾** - 监控隧道状态，主隧道异常自动切换 CNAME 到备用隧道
            - 🌐 **DDNS 解析** - 监控本机 IP 变化自动更新 DNS 解析
            - 🔒 **SSL 证书** - 通过 DNS API 自动申请免费 SSL 证书

            ## 📥 下载说明

            | 平台 | 安装包 | 说明 |
            |------|--------|------|
            | Windows | `.msi` 或 `.exe` | 双击安装即可 |
            | macOS | `.dmg` | 拖拽到应用程序文件夹（仅支持 Apple Silicon） |
            | Linux (x64) | `.deb` 或 `.AppImage` | 适用于 PC、服务器（Intel/AMD） |
            | Linux (ARM64) | `.deb` 或 `.AppImage` | 适用于树莓派 4/5、香橙派等 ARM64 设备 |

            ## 📋 系统要求

            - **Windows**: Windows 10/11 (x64)
            - **macOS**: macOS 11.0+ (Apple Silicon)
            - **Linux (x64)**: Ubuntu 20.04+ 或同等 Debian 系发行版
            - **Linux (ARM64)**: Ubuntu 22.04+ / Raspberry Pi OS (Bookworm) / Armbian 等 aarch64 系统

            ---

            **问题反馈**: https://github.com/zhengddzz/ChmlFrp-Community-Toolbox/issues
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
